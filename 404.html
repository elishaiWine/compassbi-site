<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הדף לא נמצא | Page not found - Compass BI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7F7F7">
<!-- GitHub Pages serves this file, with a real 404 status, for any address the
     site does not have. Absolute links on purpose: it is served from any depth.
     No redirect to the home page - a 404 that answers 200 or 301 is what
     search engines call a soft 404. The old WordPress addresses that do have
     a new home are handled by legacy/ (see _legacy-urls.tsv). -->
<style>
:root{color-scheme:only light;--purple:#21076A;--blue:#3D7EDB;--orange:#DC5034;--ink:#14131C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(135deg,#fff,#EEF3FC 60%,#E3ECFB);color:var(--ink);
  font-family:Heebo,Assistant,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;text-align:center}
.n{font-size:84px;font-weight:700;line-height:1;color:var(--purple);margin:0 0 8px;letter-spacing:2px}
.n span{color:var(--orange)}
h1{font-size:26px;margin:0 0 10px;color:var(--purple)}
p{margin:0 0 22px;font-size:17px;line-height:1.6}
.en{direction:ltr;margin-top:30px;padding-top:24px;border-top:1px solid #d9e2f3}
.en h1{font-size:21px}
a.b{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--orange);color:#fff;
  font-weight:700;text-decoration:none}
a.b:hover,a.b:focus-visible{background:#b83f26}
a.b:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="n" aria-hidden="true">4<span>0</span>4</p>
  <h1>הדף הזה לא נמצא</h1>
  <p>ייתכן שהכתובת השתנתה. אפשר להמשיך מדף הבית.</p>
  <a class="b" href="/">לדף הבית</a>
  <div class="en" lang="en">
    <h1>This page could not be found</h1>
    <p>The address may have changed. You can carry on from the home page.</p>
    <a class="b" href="/en/">To the home page</a>
  </div>
</main>
</body>
</html>
